name: Générer un Short

# Déclenché à distance par le Worker Cloudflare via repository_dispatch
on:
  repository_dispatch:
    types: [new_short]

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      # On écrit le script reçu dans un fichier via une variable d'env plutôt que
      # de l'interpoler directement dans le shell — évite tout risque d'injection
      # si le texte envoyé contient des caractères spéciaux (", $, `, etc.)
      - name: Écrire le script reçu dans un fichier
        env:
          SCRIPT_TEXT: ${{ github.event.client_payload.script }}
        run: |
          printf '%s' "$SCRIPT_TEXT" > script.txt
          echo "Script écrit dans script.txt :"
          cat script.txt

      - name: Installer Python et les dépendances
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet edge-tts langdetect yake requests

      - name: Générer la voix off (edge-tts)
        run: |
          python3 <<'EOF'
          from langdetect import detect
          import subprocess

          with open("script.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          try:
              lang = detect(text)
          except Exception:
              lang = "fr"  # repli par défaut si la détection échoue

          # On sauvegarde la langue détectée pour la réutiliser dans les étapes suivantes
          with open("lang.txt", "w") as f:
              f.write(lang)

          # Voix masculines dynamiques edge-tts
          voices = {
              "fr": "fr-FR-HenriNeural",
              "en": "en-US-GuyNeural",
          }
          voice = voices.get(lang, voices["fr"])

          print(f"Langue détectée : {lang} -> voix choisie : {voice}")

          subprocess.run([
              "edge-tts",
              "--voice", voice,
              "--text", text,
              "--write-media", "voix_off.mp3"
          ], check=True)
          EOF

      - name: Extraire les mots-clés du script (yake)
        run: |
          python3 <<'EOF'
          import yake

          with open("script.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()
          with open("lang.txt", "r") as f:
              lang = f.read().strip()

          # yake ne connaît que "fr"/"en" etc., déjà compatible avec langdetect
          extractor = yake.KeywordExtractor(lan=lang, n=1, top=5, dedupLim=0.9)
          keywords = [kw for kw, score in extractor.extract_keywords(text)]

          if not keywords:
              keywords = ["nature", "ville", "mouvement"]  # repli si extraction vide

          print("Mots-clés extraits :", keywords)

          with open("keywords.txt", "w", encoding="utf-8") as f:
              f.write("\n".join(keywords))
          EOF

      - name: Télécharger les clips vidéo (API Pexels)
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          python3 <<'EOF'
          import os
          import requests

          api_key = os.environ["PEXELS_API_KEY"]
          headers = {"Authorization": api_key}

          with open("keywords.txt", "r", encoding="utf-8") as f:
              keywords = [line.strip() for line in f if line.strip()]

          downloaded = []

          for i, keyword in enumerate(keywords):
              try:
                  resp = requests.get(
                      "https://api.pexels.com/videos/search",
                      headers=headers,
                      params={"query": keyword, "orientation": "portrait", "per_page": 1},
                      timeout=20,
                  )
                  resp.raise_for_status()
                  data = resp.json()
                  videos = data.get("videos", [])
                  if not videos:
                      print(f"Aucun résultat pour '{keyword}', on ignore.")
                      continue

                  # On choisit le fichier vidéo de qualité "hd" le plus proche de 1080p vertical
                  video_files = videos[0]["video_files"]
                  best = min(
                      video_files,
                      key=lambda vf: abs((vf.get("height") or 0) - 1920),
                  )
                  video_url = best["link"]

                  clip_path = f"clip_{i}.mp4"
                  video_data = requests.get(video_url, timeout=60)
                  with open(clip_path, "wb") as out:
                      out.write(video_data.content)

                  downloaded.append(clip_path)
                  print(f"Téléchargé : {clip_path} (mot-clé: {keyword})")

              except Exception as e:
                  print(f"Erreur pour le mot-clé '{keyword}': {e}")

          with open("clips_list.txt", "w") as f:
              f.write("\n".join(downloaded))

          print(f"{len(downloaded)} clip(s) téléchargé(s) au total.")
          EOF

      - name: Installer ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Assembler la vidéo finale (FFmpeg)
        run: |
          python3 <<'EOF'
          import subprocess

          def ffprobe_duration(path):
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", path],
                  capture_output=True, text=True, check=True
              )
              return float(result.stdout.strip())

          with open("clips_list.txt") as f:
              clips = [line.strip() for line in f if line.strip()]

          if not clips:
              raise SystemExit("Aucun clip téléchargé, impossible d'assembler la vidéo.")

          audio_duration = ffprobe_duration("voix_off.mp3")
          per_clip_duration = audio_duration / len(clips)
          print(f"Durée audio : {audio_duration:.2f}s -> {per_clip_duration:.2f}s par clip ({len(clips)} clips)")

          # 1. On découpe et recadre chaque clip en format vertical 1080x1920,
          #    avec une durée égale pour chacun
          segment_files = []
          for i, clip in enumerate(clips):
              segment = f"segment_{i}.mp4"
              subprocess.run([
                  "ffmpeg", "-y", "-i", clip, "-t", str(per_clip_duration),
                  "-vf", "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1",
                  "-c:v", "libx264", "-preset", "veryfast",
                  "-c:a", "aac", "-ar", "44100", "-ac", "2",
                  segment
              ], check=True)
              segment_files.append(segment)

          # 2. On met les segments bout à bout
          with open("concat_list.txt", "w") as f:
              for seg in segment_files:
                  f.write(f"file '{seg}'\n")

          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "concat_list.txt",
              "-c", "copy", "video_concat.mp4"
          ], check=True)

          # 3. On mixe la voix off (au premier plan) avec le son original des clips
          #    (en fond sonore léger, volume réduit)
          subprocess.run([
              "ffmpeg", "-y",
              "-i", "video_concat.mp4",
              "-i", "voix_off.mp3",
              "-filter_complex",
              "[0:a]volume=0.15[bg];[1:a]volume=1.0[voice];[bg][voice]amix=inputs=2:duration=longest:dropout_transition=2[aout]",
              "-map", "0:v", "-map", "[aout]",
              "-c:v", "copy", "-shortest",
              "short_final.mp4"
          ], check=True)

          print("Vidéo finale générée : short_final.mp4")
          EOF

      - name: Envoyer la vidéo finale sur Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F chat_id="${{ github.event.client_payload.chat_id }}" \
            -F video=@short_final.mp4 \
            -F caption="🎉 Ton Short est prêt !"
