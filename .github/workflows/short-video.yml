name: Générer un Short (v2 - IA scénariste)

# Déclenché à distance par le Worker Cloudflare via repository_dispatch
on:
  repository_dispatch:
    types: [new_short]

jobs:
  build-short:
    runs-on: ubuntu-latest
    steps:
      # On écrit le script reçu dans un fichier via une variable d'env plutôt que
      # de l'interpoler directement dans le shell — évite tout risque d'injection
      # si le texte envoyé contient des caractères spéciaux (", $, `, etc.)
      - name: Écrire le script reçu dans un fichier
        env:
          SCRIPT_TEXT: ${{ github.event.client_payload.script }}
        run: |
          printf '%s' "$SCRIPT_TEXT" > script.txt
          echo "Script écrit dans script.txt :"
          cat script.txt

      - name: Installer Python et les dépendances
        run: |
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet edge-tts langdetect requests

      - name: Détecter la langue du script
        run: |
          python3 <<'EOF'
          from langdetect import detect

          with open("script.txt", "r", encoding="utf-8") as f:
              text = f.read().strip()

          try:
              lang = detect(text)
          except Exception:
              lang = "fr"

          with open("lang.txt", "w") as f:
              f.write(lang)

          print(f"Langue détectée : {lang}")
          EOF

      - name: Découper le script en scènes (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'EOF'
          import os
          import json
          import requests

          with open("script.txt", "r", encoding="utf-8") as f:
              script = f.read().strip()

          system_prompt = (
              "Tu es un réalisateur vidéo spécialisé dans les Shorts. Reçois ce script de "
              "voix off. Découpe-le en séquences de 4 à 5 secondes de lecture orale (garde "
              "le texte exact du script, ne le reformule pas, ne le traduis pas). Pour chaque "
              "séquence, fournis : 1) le segment de texte exact (dans la langue d'origine du "
              "script), 2) deux mots-clés précis EN ANGLAIS pour trouver une vidéo d'illustration "
              "sur Pexels. Évite les concepts abstraits (ex: 'succès'), utilise du concret "
              "(ex: 'man in suit raising hands', 'office timelapse'). Réponds uniquement avec "
              "un tableau JSON de cette forme, sans aucun texte autour : "
              '[{"text": "...", "search_term": "..."}]'
          )

          resp = requests.post(
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent",
              params={"key": os.environ["GEMINI_API_KEY"]},
              json={
                  "contents": [{"parts": [{"text": f"{system_prompt}\n\nScript :\n{script}"}]}],
                  "generationConfig": {"responseMimeType": "application/json"},
              },
              timeout=30,
          )
          resp.raise_for_status()
          data = resp.json()
          raw_text = data["candidates"][0]["content"]["parts"][0]["text"]
          scenes = json.loads(raw_text)

          if not scenes:
              raise SystemExit("Gemini n'a renvoyé aucune scène.")

          print(f"{len(scenes)} scène(s) générée(s) :")
          for s in scenes:
              print(f"  - \"{s['text'][:50]}...\" -> {s['search_term']}")

          with open("scenes.json", "w", encoding="utf-8") as f:
              json.dump(scenes, f, ensure_ascii=False, indent=2)
          EOF

      - name: Installer ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version
          ffprobe -version

      - name: Générer la voix off et télécharger les clips, scène par scène
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'EOF'
          import os
          import json
          import subprocess
          import requests

          with open("scenes.json", "r", encoding="utf-8") as f:
              scenes = json.load(f)
          with open("lang.txt") as f:
              lang = f.read().strip()

          voices = {
              "fr": "fr-FR-RemyMultilingualNeural",
              "en": "en-US-AndrewMultilingualNeural",
          }
          voice = voices.get(lang, voices["fr"])

          pexels_headers = {"Authorization": os.environ["PEXELS_API_KEY"]}
          gemini_key = os.environ["GEMINI_API_KEY"]

          # Filet de sécurité ultime si même le fallback Gemini échoue,
          # pour ne jamais planter tout le pipeline sur une seule scène
          GENERIC_FALLBACKS = ["nature landscape", "city timelapse", "abstract background"]

          def search_pexels(query):
              resp = requests.get(
                  "https://api.pexels.com/videos/search",
                  headers=pexels_headers,
                  params={"query": query, "orientation": "portrait", "per_page": 1},
                  timeout=20,
              )
              resp.raise_for_status()
              return resp.json().get("videos", [])

          def ask_gemini_simpler_term(original_term):
              prompt = (
                  f"Le terme de recherche vidéo '{original_term}' n'a donné aucun résultat sur "
                  "Pexels. Donne UN SEUL terme de recherche en anglais, plus simple et plus "
                  "générique (2-3 mots maximum), pour du stock-footage. Réponds uniquement avec "
                  'un JSON de cette forme : {"search_term": "..."}'
              )
              resp = requests.post(
                  "https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent",
                  params={"key": gemini_key},
                  json={
                      "contents": [{"parts": [{"text": prompt}]}],
                      "generationConfig": {"responseMimeType": "application/json"},
                  },
                  timeout=30,
              )
              resp.raise_for_status()
              raw = resp.json()["candidates"][0]["content"]["parts"][0]["text"]
              return json.loads(raw)["search_term"]

          def ffprobe_duration(path):
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", path],
                  capture_output=True, text=True, check=True
              )
              return float(result.stdout.strip())

          scene_audio_files = []
          scene_clip_files = []

          for i, scene in enumerate(scenes):
              text = scene["text"]
              search_term = scene["search_term"]

              # 1. Voix off de cette scène précisément (durée exacte connue ensuite)
              audio_path = f"scene_audio_{i}.mp3"
              subprocess.run([
                  "edge-tts", "--voice", voice, "--rate=-8%",
                  "--text", text, "--write-media", audio_path
              ], check=True)
              scene_audio_files.append(audio_path)

              # 2. Recherche du clip Pexels, avec fallback Gemini si rien trouvé
              videos = search_pexels(search_term)
              used_term = search_term

              if not videos:
                  try:
                      simpler_term = ask_gemini_simpler_term(search_term)
                      print(f"Scène {i} : fallback Gemini '{search_term}' -> '{simpler_term}'")
                      videos = search_pexels(simpler_term)
                      used_term = simpler_term
                  except Exception as e:
                      print(f"Scène {i} : échec du fallback Gemini ({e})")

              if not videos:
                  for generic in GENERIC_FALLBACKS:
                      videos = search_pexels(generic)
                      if videos:
                          used_term = generic
                          print(f"Scène {i} : filet de sécurité générique -> '{generic}'")
                          break

              if not videos:
                  raise SystemExit(f"Scène {i} : impossible de trouver un clip, même en secours.")

              video_files = videos[0]["video_files"]
              best = min(video_files, key=lambda vf: abs((vf.get("height") or 0) - 1920))
              clip_path = f"scene_clip_{i}.mp4"
              video_data = requests.get(best["link"], timeout=60)
              with open(clip_path, "wb") as out:
                  out.write(video_data.content)
              scene_clip_files.append(clip_path)

              duration = ffprobe_duration(audio_path)
              print(f"Scène {i} : \"{text[:40]}...\" -> mot-clé '{used_term}', audio {duration:.2f}s")

          with open("scene_audio_list.txt", "w") as f:
              f.write("\n".join(scene_audio_files))
          with open("scene_clip_list.txt", "w") as f:
              f.write("\n".join(scene_clip_files))
          EOF

      - name: Choisir une musique de fond
        run: |
          if ls music/*.mp3 >/dev/null 2>&1; then
            MUSIC_FILE=$(ls music/*.mp3 | shuf -n 1)
            echo "Musique choisie : $MUSIC_FILE"
            echo "MUSIC_FILE=$MUSIC_FILE" >> "$GITHUB_ENV"
          else
            echo "Aucune musique trouvée dans music/, la vidéo sera générée sans musique de fond."
            echo "MUSIC_FILE=" >> "$GITHUB_ENV"
          fi

      - name: Assembler la vidéo finale, scène par scène (FFmpeg)
        run: |
          python3 <<'EOF'
          import subprocess
          import os

          def ffprobe_duration(path):
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-show_entries", "format=duration", "-of", "csv=p=0", path],
                  capture_output=True, text=True, check=True
              )
              return float(result.stdout.strip())

          def has_audio(path):
              result = subprocess.run(
                  ["ffprobe", "-v", "error", "-select_streams", "a",
                   "-show_entries", "stream=index", "-of", "csv=p=0", path],
                  capture_output=True, text=True
              )
              return bool(result.stdout.strip())

          with open("scene_audio_list.txt") as f:
              scene_audios = [line.strip() for line in f if line.strip()]
          with open("scene_clip_list.txt") as f:
              scene_clips = [line.strip() for line in f if line.strip()]

          if not scene_clips:
              raise SystemExit("Aucune scène à assembler.")

          video_filter = "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,setsar=1,fps=30"
          segment_files = []

          # Chaque clip est calé EXACTEMENT sur la durée de la voix off de sa propre scène
          for i, (audio, clip) in enumerate(zip(scene_audios, scene_clips)):
              duration = ffprobe_duration(audio)
              segment = f"segment_{i}.mp4"
              if has_audio(clip):
                  cmd = [
                      "ffmpeg", "-y", "-i", clip, "-t", str(duration),
                      "-vf", video_filter,
                      "-c:v", "libx264", "-preset", "veryfast",
                      "-c:a", "aac", "-ar", "44100", "-ac", "2",
                      segment
                  ]
              else:
                  cmd = [
                      "ffmpeg", "-y", "-i", clip,
                      "-f", "lavfi", "-i", "anullsrc=channel_layout=stereo:sample_rate=44100",
                      "-t", str(duration),
                      "-vf", video_filter,
                      "-map", "0:v", "-map", "1:a",
                      "-c:v", "libx264", "-preset", "veryfast",
                      "-c:a", "aac", "-ar", "44100", "-ac", "2",
                      "-shortest",
                      segment
                  ]
              subprocess.run(cmd, check=True)
              segment_files.append(segment)

          # On met les segments vidéo bout à bout
          with open("concat_video_list.txt", "w") as f:
              for seg in segment_files:
                  f.write(f"file '{seg}'\n")
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "concat_video_list.txt",
              "-c:v", "libx264", "-preset", "veryfast", "-c:a", "aac",
              "video_concat.mp4"
          ], check=True)

          # On met les voix off de chaque scène bout à bout (narration complète et synchronisée)
          with open("concat_audio_list.txt", "w") as f:
              for a in scene_audios:
                  f.write(f"file '{a}'\n")
          subprocess.run([
              "ffmpeg", "-y", "-f", "concat", "-safe", "0", "-i", "concat_audio_list.txt",
              "-c", "copy", "voix_off_full.mp3"
          ], check=True)

          audio_duration = ffprobe_duration("voix_off_full.mp3")
          music_file = os.environ.get("MUSIC_FILE", "").strip()

          if music_file:
              subprocess.run([
                  "ffmpeg", "-y",
                  "-i", "video_concat.mp4",
                  "-i", "voix_off_full.mp3",
                  "-stream_loop", "-1", "-i", music_file,
                  "-filter_complex",
                  "[0:a]volume=0.10[bg];"
                  "[1:a]volume=1.0[voice];"
                  f"[2:a]atrim=0:{audio_duration},volume=0.12[music];"
                  "[bg][voice][music]amix=inputs=3:duration=first:dropout_transition=2[aout]",
                  "-map", "0:v", "-map", "[aout]",
                  "-c:v", "copy", "-shortest",
                  "short_final.mp4"
              ], check=True)
          else:
              subprocess.run([
                  "ffmpeg", "-y",
                  "-i", "video_concat.mp4",
                  "-i", "voix_off_full.mp3",
                  "-filter_complex",
                  "[0:a]volume=0.15[bg];[1:a]volume=1.0[voice];[bg][voice]amix=inputs=2:duration=longest:dropout_transition=2[aout]",
                  "-map", "0:v", "-map", "[aout]",
                  "-c:v", "copy", "-shortest",
                  "short_final.mp4"
              ], check=True)

          print("Vidéo finale générée : short_final.mp4")
          EOF

      - name: Envoyer la vidéo finale sur Telegram
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendVideo" \
            -F chat_id="${{ github.event.client_payload.chat_id }}" \
            -F video=@short_final.mp4 \
            -F caption="🎉 Ton Short est prêt (v2 - IA scénariste) !"
